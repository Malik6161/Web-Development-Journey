<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character Encoding -->
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Random Color Generator</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ==========================
         Main Container
    =========================== -->

    <main class="container">

        <h1>🎨 Random Color Generator</h1>

        <p class="description">
            Click the button or press the <strong>Spacebar</strong> to generate a random color.
        </p>

        <!-- Color Preview Box -->
        <div class="color-box" id="colorBox"></div>

        <!-- Color Code -->
        <h2 id="colorCode">#FFFFFF</h2>

        <!-- Buttons -->
        <div class="buttons">

            <button id="generateBtn">
                Generate Color
            </button>

            <button id="copyBtn">
                Copy Code
            </button>

        </div>

        <!-- Success Message -->
        <p class="message" id="message"></p>

    </main>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
