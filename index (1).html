<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Calculator</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Marks Calculator</h1>

        <p><b>Enter student information and marks below.</b></p>

        <label for="studentName">Student Name:</label>
        <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
        >

        <label for="rollNumber">Roll Number:</label>
        <input
            type="text"
            id="rollNumber"
            placeholder="Enter roll number"
        >

        <label for="htmlMarks">HTML Marks (out of 100):</label>
        <input
            type="number"
            id="htmlMarks"
            placeholder="Enter HTML marks"
            min="0"
            max="100"
        >

        <label for="jsMarks">JavaScript Marks (out of 100):</label>
        <input
            type="number"
            id="jsMarks"
            placeholder="Enter JavaScript marks"
            min="0"
            max="100"
        >

        <button type="button" id="calculateButton">
            Calculate Result
        </button>

        <div id="result">
            Your result will appear here.
        </div>

    </div>

    <!-- Connect JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
