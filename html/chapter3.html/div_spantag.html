<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and span tag</title>
</head>
<body>
    <!--use as a container for other elements it always takes the full width of its parent container . its a block-level element that takes full width-->
    <div>
        <p>This is a paragraph inside a div.</p>
    </div>
    <span>This is a span tag.</span>
    <span>This is another span tag.</span> 
    <!--span is an inline element that does not take the full width of its parent container. it only takes the width of its content. it is used to group inline elements and apply styles to them.-->

</body>
</html>
