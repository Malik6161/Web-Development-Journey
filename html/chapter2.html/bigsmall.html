<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big and Small Text</title>
</head>
<body>
    <big>This is big text.</big><br>
    <hr>
    <small>This is small text.</small><br>
    this is a  <sub>subscript text.</sub><br>
    this  is a <sup>superscript text.</sup><br>   
    H <sub>2</sub>O is the chemical formula for water.<br>
    E = mc <sup>2</sup> is Einstein's famous equation.<br>


</body>
</html>
