<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <h1>HTML FORM</h1>
    <p>HTML forms are used to collect user input and send it to a server for processing. They consist of various form elements such as text fields, checkboxes, radio buttons, and submit buttons.</p>
    <form action="/submit" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="    gender" value="male">
        <label for="male">Male</label>
        <label for="female">   Female</label>
        <input type="radio" id="female" name="gender" value="female"><br><br>
        <label for="hobbies">Hobbies:</label>
        <input type="checkbox" id="hobby1" name="hobbies" value="reading">
        <label for="hobby1">Reading</label>
        <input type="checkbox" id="hobby2" name="hobbies" value="traveling">
        <label for="hobby2">Traveling</label>
        <input type="checkbox" id="hobby3" name="hobbies" value="cooking">
        <label for="hobby3">Cooking</label><br><br>
        <label for="country">Country:</label>
        <select id="country" name="country">    
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
            <option value="australia">Australia</option>
        </select><br><br>
    </form>

        <input type="submit" value="Submit">
    </form>
    
</body>
</html>
